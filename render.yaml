# Blueprint de Render. Servicio Web (Docker) que expone el convertidor por HTTP.
# Make le hace POST /convert con el Excel/Word y recibe el PDF de vuelta.
# No necesita credenciales de WhatsApp: Make se encarga de enviar y guardar.
services:
  - type: web
    name: pdf-convertidor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHON_BIN
        value: python3
      - key: PASSWORD_MSG
        value: Error archivo con contraseña
