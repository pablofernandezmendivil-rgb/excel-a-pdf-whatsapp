# Blueprint de Render. Crea un Background Worker con Docker.
# En Render: New + -> Blueprint -> conecta el repo con estos archivos.
# Luego llena las variables marcadas (sync:false) en el panel de Render.
services:
  - type: worker
    name: pdf-convertidor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: GREENAPI_ID_INSTANCE
        sync: false
      - key: GREENAPI_API_TOKEN
        sync: false
      - key: GREENAPI_API_URL
        value: https://7107.api.greenapi.com
      - key: GREENAPI_MEDIA_URL
        value: https://7107.api.greenapi.com
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: PYTHON_BIN
        value: python3
      - key: PASSWORD_MSG
        value: Error archivo con contraseña
