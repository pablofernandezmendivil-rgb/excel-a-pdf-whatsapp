# Blueprint de Render. Servicio Web (Docker) que expone el convertidor por HTTP.
# Endpoints:
#   POST /convert           -> devuelve el PDF (Make maneja el envío)
#   POST /convert-and-send  -> convierte y ENVÍA el PDF al grupo por Green API
#                              (Make solo necesita UN módulo que llame aquí)
services:
  - type: web
    name: pdf-convertidor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHON_BIN
        value: python3
      - key: PASSWORD_MSG
        value: Error archivo con contraseña
      - key: GREENAPI_ID_INSTANCE
        value: "7107629985"
      - key: GREENAPI_API_URL
        value: https://7107.api.greenapi.com
      - key: GREENAPI_MEDIA_URL
        value: https://7107.api.greenapi.com
      - key: DEFAULT_CHAT_ID
        value: 120363430907627721@g.us
      # El token se pone en el panel de Render (no en el repo).
      - key: GREENAPI_API_TOKEN
        sync: false
