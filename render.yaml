# Blueprint de Render. Servicio Web (Docker) del convertidor.
#   POST /convert           -> devuelve el PDF
#   POST /convert-and-send  -> convierte y envía el PDF al grupo por Green API
# Si un Excel viene en chino y hay ANTHROPIC_API_KEY, traduce (chino->inglés)
# conservando formato/imágenes y arma PDF: traducido arriba + original abajo.
services:
  - type: web
    name: pdf-convertidor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PYTHON_BIN
        value: python3
      - key: PASSWORD_MSG
        value: Error archivo con contraseña
      - key: GREENAPI_ID_INSTANCE
        value: "7107629985"
      - key: GREENAPI_API_URL
        value: https://7107.api.greenapi.com
      - key: GREENAPI_MEDIA_URL
        value: https://7107.api.greenapi.com
      - key: DEFAULT_CHAT_ID
        value: 120363430907627721@g.us
      - key: TRANSLATE_TARGET_LANG
        value: English
      - key: CLAUDE_MODEL
        value: claude-3-5-sonnet-latest
      # Secretos (se ponen en el panel de Render, no en el repo):
      - key: GREENAPI_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
